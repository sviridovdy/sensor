bluetooth:
  scan_interval: 60      # seconds between scan cycles
  scan_duration: 10       # seconds to actively scan per cycle
  miss_threshold: 5      # consecutive missed scans before marking device as away

devices:
  - name: "Alice iPhone"
    mac: "AA:BB:CC:DD:EE:FF"
  - name: "Bob Pixel"
    mac: "11:22:33:44:55:66"
    # Android randomizes BLE MAC addresses, so add the phone's advertised BLE
    # name as a fallback. Find it by running with LOG_LEVEL=DEBUG and looking
    # for "BLE scan:" log lines, or check Settings > About phone > Device name.
    ble_name: "Bob's Pixel 8"

automations:
  # "anyone_home" fires when the house transitions between occupied and empty
  - name: "House lights"
    trigger:
      type: anyone_home
    on_arrive:
      - url: "http://192.168.1.100:8080/api/lights"
        method: POST
        json:
          action: "turn_on"
    on_leave:
      - url: "http://192.168.1.100:8080/api/lights"
        method: POST
        json:
          action: "turn_off"

  # "device" fires for a specific person's phone
  - name: "Alice welcome scene"
    trigger:
      type: device
      device: "Alice iPhone"   # must match the name in devices above
    on_arrive:
      - url: "http://192.168.1.100:8080/api/scene/alice_home"
        method: POST
    on_leave: []

  # Template variables available anywhere in url / headers / json / body:
  #   {device_name}  — name from config
  #   {device_mac}   — MAC address
  #   {state}        — "home" or "away"
  #
  # - name: "Generic webhook example"
  #   trigger:
  #     type: anyone_home
  #   on_arrive:
  #     - url: "http://example.com/webhook"
  #       method: POST
  #       headers:
  #         Authorization: "Bearer YOUR_TOKEN"
  #       json:
  #         who: "{device_name}"
  #         state: "{state}"
  #   on_leave:
  #     - url: "http://example.com/webhook"
  #       method: POST
  #       headers:
  #         Authorization: "Bearer YOUR_TOKEN"
  #       json:
  #         who: "{device_name}"
  #         state: "{state}"
